<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zamzam Capital</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo">ZC</div>
    <div>
      <strong>ZAMZAM CAPITAL</strong>
      <small>PORTFOLIO SUMMARY</small>
    </div>
  </header>
  <main>
    <h1>Portfolio Audit Summary</h1>
    <div id="summary-container" class="summary-box">
      <div class="summary-loading">Scanning holdings…</div>
    </div>

    <input id="lookup-input" type="text" placeholder="Lookup any stock…" autocomplete="off" style="margin-top:10px;">
    <div id="lookup-result" class="lookup-card" hidden></div>

    <div id="data-status" class="status">Checking dataset…</div>
    <button id="refresh">↻ Refresh screener data</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
